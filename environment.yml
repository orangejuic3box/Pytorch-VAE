name: Pytorch-vae
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10  # Updated Python version
  - blas=*=openblas  # Use OpenBLAS instead of Intel MKL
  - numpy
  - matplotlib
  - pillow
  - pip
  - pytorch
  - torchvision
  - torchaudio
  - tqdm
  - scipy
  - ninja  # Helps with fast compilation
  - pip:
    - click
    - opencv-python
    - torch  # Ensures latest PyTorch
prefix: /Users/macbook/miniconda3/envs/Pytorch-vae
